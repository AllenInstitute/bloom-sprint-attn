[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bloom-arch"
version = "0.1.0"
description = "Transformer model components for genomic sequence-to-function modeling"
requires-python = ">=3.12"
dependencies = [
    "torch",
    "numpy",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["src/bloom_arch"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
